name: beads-pm evals

# Runs the beads-pm skill evals (beads-pm/evals/) against a real model.
# Each run costs money, so it runs only on pushes to main that touch the
# plugin, and on demand. It never runs on pull requests: the job holds an API
# key and executes case scaffold scripts and model-driven Bash, which must not
# happen for code from a fork.

on:
  push:
    branches: [main]
    paths:
      - "beads-pm/**"
      - ".github/workflows/beads-pm-evals.yml"
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per case"
        default: "1"
      case:
        description: "Only cases matching this glob (blank for all)"
        default: ""

permissions:
  contents: read

concurrency:
  group: beads-pm-evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # bubblewrap and socat: the eval's Bash sandbox needs them on Linux.
      - name: Install sandbox dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat

      - name: Install Claude Code and bd
        run: npm install -g @anthropic-ai/claude-code@2.1.326 @beads/bd@1.3.4

      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNS: ${{ inputs.runs || '1' }}
          CASE: ${{ inputs.case }}
        run: |
          args=(--runs "$RUNS")
          if [[ -n "$CASE" ]]; then args+=(--case "$CASE"); fi
          beads-pm/evals/run-evals "${args[@]}" -- --output-dir "$RUNNER_TEMP/eval-results"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beads-pm-eval-report
          path: ${{ runner.temp }}/eval-results/
          if-no-files-found: ignore
