[project]
name = "screen-recorder"
version = "1.0.0"
description = "Record macOS screen with verification, retry logic, and format conversion for Discord, GitHub, JetBrains"
requires-python = ">=3.11"
dependencies = [
    # macOS framework bindings
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-ScreenCaptureKit>=10.0",
    "pyobjc-framework-AVFoundation>=10.0",
    "pyobjc-framework-CoreMedia>=10.0",
    # Process information
    "psutil>=5.9",
    # Frame extraction and perceptual hashing
    "pillow>=10.0",
    "imagehash>=4.3",
    # CLI framework
    "typer>=0.15.0",
]

[project.scripts]
screen-recorder = "screen_recorder.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
